# Strand profiles, generic part. The device adds its own lines to the same
# sections in /system_ext/etc/strand/device.conf.
#
# Profile actions (each is undone when the profile is left):
#   write PATH VALUE         sysfs/procfs; VALUE may be @max, @min or @pct:N
#                            for cpufreq and devfreq nodes
#   setting NS KEY VALUE     Settings provider (system, secure, global)
#   prop sys.strand.X VALUE  system property
#   powersave on|off         Android battery saver (power HAL LOW_POWER)
#   fixedperf on|off         power HAL FIXED_PERFORMANCE mode
#   deviceconfig NS KEY VAL  DeviceConfig flag (cmd device_config)
#   dnd off|priority|alarms|none
# Pressure only:
#   kick PATH VALUE          one-shot write, not undone

[base]
# Android's Smart Idle Maintenance (vold, Android 13+): paces f2fs GC from
# the write rate and the flash's wear level. Built in but off by default.
deviceconfig storage_native_boot smart_idle_maint_enabled true

[hot]
# While the device is hot (thermal status severe or worse): lighter blur.
# Strand is also quiet then: no compaction kicks, no maintenance.
prop sys.strand.blur.lite 1

[memory]
# Pressure: tasks stalled on memory for psi_some_ms in a psi_window_ms window
psi_some_ms = 150
psi_window_ms = 1000
# Pressure writes stay until this long without another event
calm_s = 30
# Kicks run at most this often
kick_interval_s = 120

[pressure]
# Defragment free memory so the next large GPU/camera allocation doesn't
# have to compact in the allocating thread.
kick /proc/sys/vm/compact_memory 1

[profile balanced]
label = Balanced

[profile performance]
label = Performance

[profile battery]
label = Battery saver
powersave on
prop sys.strand.blur.lite 1
# Deep sleep (Doze) about 10 minutes after the screen goes off instead of
# 30+, and without waiting for the motion sensor to settle
deviceconfig device_idle light_after_inactive_to 60000
deviceconfig device_idle inactive_to 600000
deviceconfig device_idle sensing_to 0
deviceconfig device_idle locating_to 0
deviceconfig device_idle motion_inactive_to 0
deviceconfig device_idle idle_after_inactive_to 0

[profile gaming]
label = Gaming
dnd priority

[adaptive]
# Games and heavy GPU work get a quiet system: no compaction kicks, no
# maintenance until they end. The device sets gpu_busy_path.
gpu_busy_pct = 85
gpu_busy_s = 5
# Thermal status (PowerManager) that counts as hot
hot_status = 3
# Clear app caches (once a day) when /data has less free space than this
low_storage_pct = 10
# Storage GC in idle windows
gc_target_dirty = 500
gc_max_min = 10

[trim]
path /data
