# Test device for tests/host-test.sh: three clusters, devfreq GPU, and
# every action kind. Real devices live in their device trees.

[profile performance]
write /sys/devices/system/cpu/cpufreq/policy0/scaling_min_freq @pct:50
write /sys/devices/system/cpu/cpufreq/policy4/scaling_min_freq @pct:45
write /sys/devices/system/cpu/cpufreq/policy7/scaling_min_freq @pct:40
write /sys/devices/platform/soc/3d00000.qcom,kgsl-3d0/devfreq/3d00000.qcom,kgsl-3d0/min_freq @pct:45
setting system min_refresh_rate 120.0
fixedperf on

[profile battery]
write /sys/devices/system/cpu/cpufreq/policy4/scaling_max_freq @pct:70
write /sys/devices/system/cpu/cpufreq/policy7/scaling_max_freq @pct:60
write /sys/devices/platform/soc/3d00000.qcom,kgsl-3d0/devfreq/3d00000.qcom,kgsl-3d0/max_freq @pct:65
setting system peak_refresh_rate 60.0

[profile gaming]
write /sys/devices/system/cpu/cpufreq/policy0/scaling_min_freq @pct:60
write /sys/devices/system/cpu/cpufreq/policy4/scaling_min_freq @pct:60
write /sys/devices/system/cpu/cpufreq/policy7/scaling_min_freq @pct:50
write /sys/devices/platform/soc/3d00000.qcom,kgsl-3d0/devfreq/3d00000.qcom,kgsl-3d0/min_freq @pct:60
setting system min_refresh_rate 120.0

[stats]
stat gpu_busy_pct /sys/class/kgsl/kgsl-3d0/gpu_busy_percentage
stat gpu_freq_mhz /sys/devices/platform/soc/3d00000.qcom,kgsl-3d0/devfreq/3d00000.qcom,kgsl-3d0/cur_freq 1000000
stat battery_pct /sys/class/power_supply/battery/capacity
stat battery_temp_dc /sys/class/power_supply/battery/temp
stat battery_cycles /sys/class/power_supply/battery/cycle_count
stat battery_full_uah /sys/class/power_supply/battery/charge_full
stat battery_design_uah /sys/class/power_supply/battery/charge_full_design

[adaptive]
low_storage_pct = 101
gpu_busy_path = /sys/class/kgsl/kgsl-3d0/gpu_busy_percentage
gpu_busy_s = 1

[base]
deviceconfig test_ns flag on

[hot]
prop sys.strand.blur.lite 1
